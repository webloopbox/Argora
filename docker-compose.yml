services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brainstorm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brainstorm
      POSTGRES_PASSWORD: brainstorm
      POSTGRES_DB: brainstorm
    ports:
      - "5432:5432"
    volumes:
      - brainstorm-pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainstorm -d brainstorm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  brainstorm-pg:
