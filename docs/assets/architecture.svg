<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-label="Argora system architecture: React client, NestJS API, PostgreSQL and the pluggable LLM layer">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#121a33"/>
    </linearGradient>
    <marker id="aArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4589ff"/>
    </marker>
  </defs>

  <rect width="1240" height="620" fill="url(#archBg)"/>
  <rect x="0" y="0" width="1240" height="3" fill="#0f62fe"/>

  <text x="48" y="56" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" letter-spacing="3" fill="#78a9ff">SYSTEM ARCHITECTURE</text>
  <text x="48" y="94" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f4f4f4">One contract package, one guard, one synthesis path</text>

  <rect x="48" y="140" width="300" height="300" rx="12" fill="#111831" stroke="#263056"/>
  <rect x="48" y="140" width="300" height="4" rx="2" fill="#4589ff"/>
  <text x="72" y="178" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#78a9ff">CLIENT</text>
  <text x="72" y="208" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f4f4f4">React 19 + TypeScript</text>
  <text x="72" y="240" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#a8b0c0">React Flow &#183; dagre layout</text>
  <text x="72" y="264" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#a8b0c0">Lasso hit test (canvas &#8594; ids)</text>
  <text x="72" y="288" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#a8b0c0">Tailwind v4 &#183; HeroUI</text>
  <text x="72" y="312" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#a8b0c0">i18n dictionary pl / en</text>
  <text x="72" y="336" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#a8b0c0">Route-level code splitting</text>
  <rect x="72" y="358" width="252" height="58" rx="8" fill="#0d1428" stroke="#2a3463"/>
  <text x="88" y="381" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1" fill="#6f7691">OPTIMISTIC UI</text>
  <text x="88" y="403" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#a8b0c0">votes reconcile on server echo</text>

  <rect x="400" y="140" width="330" height="300" rx="12" fill="#111831" stroke="#2f3b6e"/>
  <rect x="400" y="140" width="330" height="4" rx="2" fill="#0f62fe"/>
  <text x="424" y="178" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#78a9ff">API</text>
  <text x="424" y="208" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f4f4f4">NestJS 11</text>
  <rect x="424" y="226" width="282" height="40" rx="8" fill="#0d1428" stroke="#3b4a86"/>
  <text x="440" y="251" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#78a9ff">VisibilityGuard &#8594; req.debate</text>
  <text x="424" y="292" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#a8b0c0">JWT auth &#183; per-route throttling</text>
  <text x="424" y="316" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#a8b0c0">class-validator on shared DTOs</text>
  <text x="424" y="340" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#a8b0c0">Soft delete: archivedOn, never DELETE</text>
  <text x="424" y="364" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#a8b0c0">Vendor errors mapped to 429 / 503</text>
  <rect x="424" y="382" width="282" height="34" rx="8" fill="#0d1428" stroke="#2a3463"/>
  <text x="440" y="404" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#6f7691">10/min generate &#183; 20 dup &#183; 5 synthesis</text>

  <rect x="400" y="470" width="330" height="88" rx="12" fill="#161029" stroke="#5b3a7a"/>
  <text x="424" y="500" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#be95ff">@brainstorm/core</text>
  <text x="424" y="526" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#f4f4f4">DTOs &#183; enums &#183; limits &#183; validation</text>
  <text x="424" y="547" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#8d93a5">imported by both sides, never duplicated</text>

  <rect x="782" y="140" width="410" height="186" rx="12" fill="#111831" stroke="#263056"/>
  <rect x="782" y="140" width="410" height="4" rx="2" fill="#be95ff"/>
  <text x="806" y="178" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#be95ff">AI LAYER &#183; STRATEGY PATTERN</text>
  <text x="806" y="206" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#f4f4f4">interface LlmProvider { generate, synthesize,</text>
  <text x="806" y="226" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#f4f4f4">&#160;&#160;classifySide, getModelInfo }</text>
  <rect x="806" y="244" width="184" height="30" rx="6" fill="#0d1428" stroke="#2a3463"/>
  <text x="820" y="264" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#a8b0c0">watsonx.ai &#215; 3 models</text>
  <rect x="1000" y="244" width="168" height="30" rx="6" fill="#0d1428" stroke="#2a3463"/>
  <text x="1014" y="264" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#a8b0c0">together.ai &#215; 3</text>
  <rect x="806" y="282" width="112" height="30" rx="6" fill="#0d1428" stroke="#2a3463"/>
  <text x="820" y="302" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#a8b0c0">Gemini</text>
  <rect x="928" y="282" width="240" height="30" rx="6" fill="#0d1428" stroke="#2a3463"/>
  <text x="942" y="302" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#6f7691">+ Claude / GPT (implemented)</text>

  <rect x="782" y="346" width="410" height="94" rx="12" fill="#111831" stroke="#263056"/>
  <rect x="782" y="346" width="410" height="4" rx="2" fill="#08bdba"/>
  <text x="806" y="382" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#3ddbd9">EMBEDDINGS &#183; ONE ACTIVE VENDOR</text>
  <text x="806" y="408" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#a8b0c0">granite-embedding-278m-multilingual &#183; 768d</text>
  <text x="806" y="428" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#a8b0c0">or gemini-embedding-001 &#183; switch = re-embed</text>

  <rect x="782" y="470" width="410" height="88" rx="12" fill="#111831" stroke="#263056"/>
  <rect x="782" y="470" width="410" height="4" rx="2" fill="#42be65"/>
  <text x="806" y="506" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="2" fill="#42be65">POSTGRESQL 16 + pgvector</text>
  <text x="806" y="530" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#a8b0c0">partial unique indexes &#183; embeddings as JSONB</text>
  <text x="806" y="550" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#6f7691">archive-only retention, full history queryable</text>

  <line x1="348" y1="250" x2="396" y2="250" stroke="#4589ff" stroke-width="2.5" marker-end="url(#aArrow)"/>
  <text x="326" y="238" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#6f7691">REST + JWT</text>
  <line x1="730" y1="220" x2="778" y2="220" stroke="#4589ff" stroke-width="2.5" marker-end="url(#aArrow)"/>
  <line x1="730" y1="390" x2="778" y2="390" stroke="#4589ff" stroke-width="2.5" marker-end="url(#aArrow)"/>
  <line x1="730" y1="512" x2="778" y2="512" stroke="#4589ff" stroke-width="2.5" marker-end="url(#aArrow)"/>
  <path d="M565 440 L565 466" stroke="#8a5cf6" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M198 440 L198 514 L396 514" fill="none" stroke="#8a5cf6" stroke-width="2" stroke-dasharray="5 4"/>
</svg>
