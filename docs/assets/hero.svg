    <line x1="1092" y1="196" x2="1138" y2="268" stroke="#2f3b6e" stroke-width="2"/>
    <rect x="982" y="96" width="56" height="48" rx="8" fill="#e8ecf6"/>
    <circle cx="930" cy="196" r="22" fill="#42be65"/>
    <circle cx="1092" cy="196" r="22" fill="#fa4d56"/>
    <circle cx="884" cy="268" r="15" fill="#fa4d56" opacity="0.9"/>
